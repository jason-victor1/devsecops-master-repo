name: CI & Security Pipeline

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  id-token: write
  security-events: write

env:
  AWS_REGION: us-east-1
  ECR_ROLE_ARN: arn:aws:iam::123456789012:role/github-actions-dev-ingestion-role
  ECR_REPOSITORY: event-ingestion-api-dev

jobs:
  lint-and-test:
    name: Code Quality & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Application Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/requirements.txt

      - name: Python Static Analysis (Ruff)
        run: |
          ruff check src/
          ruff format --check src/

      - name: Manifest Linting (Yamllint)
        run: |
          yamllint -d "{extends: default, rules: {line-length: {max: 120}, document-start: disable}}" .

      - name: Dockerfile Security Audit (Hadolint)
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

      - name: Execute Pytest Suite with Coverage
        run: |
          pytest --cov=src/app src/tests/ --cov-report=xml --cov-fail-under=90

  iac-sast:
    name: IaC SAST Analysis (Checkov & Trivy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Run Trivy IaC Scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: config
          scan-dir: infra/
          format: sarif
          output: trivy-iac-results.sarif
          exit-code: 0
          severity: HIGH,CRITICAL

      - name: Run Checkov IaC Scanner
        uses: bridgecrewio/checkov-action@v12.3122.0
        with:
          directory: infra/terraform
          framework: terraform
          output_format: sarif
          output_file_path: checkov-results.sarif
          soft_fail: true

      - name: Upload Trivy IaC Scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-iac-results.sarif
          category: trivy-iac

      - name: Upload Checkov IaC Scan SARIF
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: checkov-results.sarif
          category: checkov-iac

  build-and-scan:
    name: OCI Build & Container Scan
    needs: [lint-and-test, iac-sast]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Build Local Container Image
        run: |
          docker build -t devsecops-api:${{ github.sha }} -t devsecops-api:latest .

      - name: Container Image Vulnerability Scan (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: devsecops-api:${{ github.sha }}
          format: table
          exit-code: 1
          ignore-unfixed: true
          vuln-type: os,library
          severity: CRITICAL

  build-and-push:
    name: Build & Push Container to ECR
    runs-on: ubuntu-latest
    needs: [lint-and-test, iac-sast]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
          audience: sts.amazonaws.com

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build, Tag, and Push Container Image to ECR
        env:
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: devsecops-api
          IMAGE_TAG: ${{ github.sha }}
        run: |
          if [ -f Dockerfile ]; then
            docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG .
          else
            docker build -t $REGISTRY/$REPOSITORY:$IMAGE_TAG ./src
          fi
          docker push $REGISTRY/$REPOSITORY:$IMAGE_TAG
