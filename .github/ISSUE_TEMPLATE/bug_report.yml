name: Security & Bug Incident Report
description: Report a bug or functional regression with verified parameters.
title: "[BUG]: "
labels: ["triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please complete this form accurately. Do **NOT** report active 0-day security exploits here; follow `SECURITY.md`.
  - type: textarea
    id: summary
    attributes:
      label: Problem Summary
      description: Provide a clear, concise description of the observed defect.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Exact commands or API calls to reproduce the bug.
      placeholder: |
        1. POST /v1/events with invalid auth
        2. Inspect status code return
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Deployment cluster, OS, or image digest where this occurred.
      placeholder: "AWS EKS 1.30 / Image: sha256:abc12345"
    validations:
      required: true
