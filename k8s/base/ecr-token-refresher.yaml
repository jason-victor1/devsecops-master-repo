apiVersion: v1
kind: ServiceAccount
metadata:
  name: ecr-token-refresher
  namespace: kyverno
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ecr-token-refresher-role
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "create", "delete", "patch", "update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ecr-token-refresher-binding
subjects:
  - kind: ServiceAccount
    name: ecr-token-refresher
    namespace: kyverno
roleRef:
  kind: ClusterRole
  name: ecr-token-refresher-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: ecr-token-refresher
  namespace: kyverno
spec:
  schedule: "0 */6 * * *"
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: ecr-token-refresher
          restartPolicy: OnFailure
          containers:
            - name: ecr-refresher
              image: amazon/aws-cli:latest
              command:
                - /bin/sh
                - -c
                - |
                  # Install kubectl binary
                  curl -sLO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
                  chmod +x kubectl && mv kubectl /usr/local/bin/

                  # Fetch new 12-hour authorization token
                  TOKEN=$(aws ecr get-login-password --region us-east-1)

                  # Update secret in kyverno namespace
                  kubectl create secret docker-registry regcred \
                    --docker-server=478076837031.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$TOKEN" \
                    -n kyverno --dry-run=client -o yaml | kubectl apply -f -

                  # Update secret in default namespace
                  kubectl create secret docker-registry regcred \
                    --docker-server=478076837031.dkr.ecr.us-east-1.amazonaws.com \
                    --docker-username=AWS \
                    --docker-password="$TOKEN" \
                    -n default --dry-run=client -o yaml | kubectl apply -f -

                  echo "ECR credentials refreshed successfully at $(date)"
              env:
                - name: AWS_REGION
                  value: "us-east-1"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: aws-credentials
                      key: AWS_SECRET_ACCESS_KEY
